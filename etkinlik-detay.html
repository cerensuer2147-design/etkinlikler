<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kariyer Günleri 2026 - Etkinlik Detayı</title>
    <link rel="stylesheet" href="css/numaran.css">
    <style>
      :root { --no: 2416501041; --ton: 321; --renk-ana: hsl(321, 65%, 38%); --renk-zemin: hsl(321, 30%, 97%); --font: Verdana, sans-serif; --bosluk-m: 1rem; --kose: 8px; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: var(--font); background-color: var(--renk-zemin); color: #111111; line-height: 1.5; padding-bottom: 2rem; }
      header { background-color: var(--renk-ana); color: #ffffff; padding: var(--bosluk-m); margin-bottom: var(--bosluk-m); }
      header h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
      nav { display: flex; flex-wrap: wrap; gap: 0.8rem; }
      nav a { color: #ffffff; text-decoration: underline; font-size: 1rem; }
      nav a:hover { opacity: 0.85; }
      main { max-width: 1000px; margin: 0 auto; padding: 0 var(--bosluk-m); }
      .detail-container { display: grid; grid-template-columns: 1fr; gap: var(--bosluk-m); margin-bottom: var(--bosluk-m); }
      @media (min-width: 650px) { .detail-container { grid-template-columns: 1fr 1fr; } }
      figure.poster-container { margin: 0; }
      .poster-box { background-color: hsl(321, 35%, 85%); color: #222222; width: 100%; height: 180px; display: flex; align-items: center; justify-content: center; border-radius: var(--kose); font-size: 1rem; }
      figcaption { font-style: italic; font-size: 0.85rem; color: #555555; margin-top: 0.4rem; }
      dl.info-list { display: grid; grid-template-columns: auto 1fr; gap: 0.6rem 1.2rem; align-content: start; }
      dl.info-list dt { font-weight: bold; }
      dl.info-list dd { margin: 0; }
      .detail-desc { margin-bottom: 1.2rem; font-size: 1rem; }
      a.back-link { color: var(--renk-ana); font-weight: bold; text-decoration: none; }
      a.back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <header>
        <h1>Kariyer Günleri 2026</h1>
        <nav>
            <a href="index.html">Ana Sayfa</a>
            <a href="etkinlikler.html">Etkinlikler</a>
            <a href="etkinlik-ekle.html">Ekle</a>
            <a href="etkinlik-guncelle.html">Güncelle</a>
        </nav>
    </header>

    <main>
        <div class="detail-container">
            <figure class="poster-container">
                <div class="poster-box">afiş görseli</div>
                <figcaption>Şekil 1: etkinlik afişi</figcaption>
            </figure>

            <dl class="info-list">
                <dt>Tarih</dt>
                <dd><time datetime="2026-10-12T14:00">12 Ekim, 14:00</time></dd>

                <dt>Yer</dt>
                <dd>A Blok Salon</dd>

                <dt>Kategori</dt>
                <dd>Seminer</dd>

                <dt>Kontenjan</dt>
                <dd>120</dd>
            </dl>
        </div>

        <p class="detail-desc">Mezunlarla kariyer söyleşileri ve şirket standları.</p>

        <p><a href="etkinlikler.html" class="back-link">← Listeye dön</a></p>
    </main>

</body>
</html>
